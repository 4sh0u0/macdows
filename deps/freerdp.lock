    "corrections_applied": [
      "CHANNEL_URBDRC=OFF — v1 does not do USB redirection; upstream default pulled in a Homebrew libusb absolute-path dependency for no product benefit (adr/0006 §3 defect #2).",
      "CMAKE_OSX_DEPLOYMENT_TARGET / CMAKE_OSX_ARCHITECTURES pinned explicitly — lab build left these empty, which is not reproducible (adr/0006 §3 defect #3).",
      "OPENSSL_ROOT_DIR points at our self-built static OpenSSL prefix instead of Homebrew's, and OPENSSL_USE_STATIC_LIBS=TRUE — lab build hard-linked absolute Homebrew openssl/libusb paths, which is not distributable and breaks on `brew upgrade` (adr/0006 §3 defect #1).",
      "WITH_URIPARSER=OFF and WITH_JSON_DISABLED=ON — two more Phase 1 scaffold discoveries, same defect class as #1/#2 but not caught by the original lab build (this dev machine has uriparser and jansson installed via Homebrew as transitive deps of unrelated formulae; the lab machine apparently didn't at build time). winpr/libwinpr/CMakeLists.txt auto-detects uriparser via find_package() and defaults WITH_URIPARSER to ON if found; cmake/JsonDetect.cmake does the same for whichever JSON backend (jansson/json-c/cJSON) happens to be present. Both silently link libwinpr3 against a Homebrew absolute path, which then fails hardened-runtime library validation at launch (unsigned/team-mismatched dylib -> abort trap). Surfaced by dyld's own fatal-load-failure stderr report (printed unconditionally on a hard load/validation failure, independent of DYLD_PRINT_LIBRARIES) when Scripts/sign-and-verify.sh launched the signed app — *not* by the DYLD_PRINT_LIBRARIES trace itself, which hardened runtime can suppress without the com.apple.security.cs.allow-dyld-environment-variables entitlement (an independent-review BLOCKER: the launch check as originally written could pass vacuously on an empty log for a dependency that loads successfully rather than crashing). Fixed by running that check against a separately, temporarily entitled copy — see Scripts/sign-and-verify.sh. WITH_JSON_DISABLED=ON is FreeRDP's single kill switch for all three JSON backends at once (cmake/JsonDetect.cmake:92), so this closes the whole defect class rather than fixing one backend and leaving the auto-detection landmine for the next machine that happens to have a different JSON library installed.",
      "Phase 2 W8: FFMPEG_/AVCODEC_/AVUTIL_ *_LIBRARIES and *_INCLUDE_DIRS are pre-seeded into the CMake cache instead of being discovered. ThirdParty/FreeRDP/cmake/FindFFmpeg.cmake probes all eight ffmpeg components and appends *every* one it finds to FFMPEG_LIBRARIES, regardless of the COMPONENTS actually requested at CMakeLists.txt:389 (AVUTIL AVCODEC). Pointing pkg-config at the self-built prefix alone was NOT sufficient: pkg-config resolved only our three components, but the module's find_library()/find_path() fall through to CMake's default prefix search, which on a Homebrew-installed CMake includes HOMEBREW_PREFIX -- so /opt/homebrew/lib/libav{device,format,filter}.dylib and libswscale.dylib were still found and linked into libfreerdp3 (verified by otool -L on the first attempt), reintroducing four GPL-3.0, absolute-path Homebrew dylibs that libfreerdp3 references zero symbols from. Because FindFFmpeg.cmake short-circuits its whole discovery block on `if(NOT FFMPEG_LIBRARIES)`, pre-seeding these turns the link line into a declared fact rather than an environment-dependent discovery, with no upstream patch. The components deliberately left unseeded (AVFORMAT/AVFILTER/AVDEVICE/SWSCALE/POSTPROCESS) then evaluate as not-found and are excluded. Backstops if this ever stops matching upstream's implementation: Scripts/build-freerdp.sh still pins PKG_CONFIG_LIBDIR, and Scripts/gen-notices.sh fails the release on any non-@rpath/non-system path in the bundle.",
      "Phase 2 W0(2) AVC caps flip (adr/0007, docs/plans/phase2.md W0 item 2): WITH_FFMPEG OFF->ON and new WITH_VIDEO_FFMPEG=ON — verified against ThirdParty/FreeRDP/CMakeLists.txt:446 that WITH_GFX_H264 (which gates RDPGFX_CAPS_FLAG_AVC_DISABLED, libfreerdp/utils/gfx.c) is driven by 'WITH_OPENH264 OR WITH_MEDIA_FOUNDATION OR WITH_VIDEO_FFMPEG OR WITH_MEDIACODEC', so WITH_VIDEO_FFMPEG is the actual gating flag, not WITH_FFMPEG itself (WITH_FFMPEG only gates the find_package(FFmpeg) probe at CMakeLists.txt:388). WITH_VIDEOTOOLBOX=ON was already present in this flag list pre-flip but was a dead no-op the whole time: it's a cmake_dependent_option on 'WITH_VIDEO_FFMPEG;APPLE' (cmake/ConfigOptions.cmake:153), and with WITH_VIDEO_FFMPEG unset/OFF the dependency silently force-set it to OFF regardless of the -D on the command line -- this flip is what makes it actually take effect (VideoToolbox hwaccel decode, per adr/0007's decision). WITH_DSP_FFMPEG (audio) and WITH_SWSCALE (generic image-scaling backend, unrelated to the GFX AVC420/444 decode path -- h264_ffmpeg.c does its own YUV420P handling without swscale) are deliberately left OFF: out of scope for this flip, no dependency of WITH_GFX_H264. See the top-level 'ffmpeg' block below for source/link-mode, and Scripts/build-freerdp.sh's CRDP_WITH_FFMPEG env toggle for the revert path."
