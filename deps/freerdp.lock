    "corrections_applied": [
      "no-module added (W4a) — the legacy provider (needed for MD4; classic NTLM's NT-hash step, which NTLMv2 responses still depend on) was building as a separately loadable providers/legacy.dylib, discovered at runtime via a MODULESDIR baked into libcrypto at compile time from --prefix. --prefix here is a placeholder path (Scripts/build-openssl.sh's OPENSSL_PREFIX_PLACEHOLDER, deliberate per an earlier W1 fix that keeps $HOME out of compiled-in constants of a shipped binary) that gets relocated after the build, so the baked-in MODULESDIR never matched where the module file actually ended up, and OSSL_PROVIDER_load(NULL, \"legacy\") silently failed to find it at runtime. Concretely: real-host NLA/CredSSP authentication failed end to end with SEC_E_NO_CREDENTIALS, for the App target and any tool linking this build alike, discovered and root-caused while verifying W4a's CRBridge/CRSession real connection against a real host (root-caused in the project status log). `no-module` (with `legacy` left at its own default-enabled state — see providers/build.info's STATIC_LEGACY branch) makes OpenSSL compile the legacy provider's object files directly into libcrypto instead of a separate module; OSSL_PROVIDER_load then resolves it from an in-process built-in-provider table, never touching the filesystem, so the placeholder-prefix relocation can no longer break it. Side effect: .build/deps/prefix/lib/ossl-modules/ still exists as a directory (OpenSSL's `make install` creates it unconditionally) but is empty post-fix — legacy.dylib (and default.dylib, itself always built-in even before this change) never get written there — this also closes, by construction, a distribution-readiness gap that would otherwise have needed separate handling (the App target's Copy Files phase never embedded ossl-modules/*.dylib into the app bundle, so a genuinely shipped/distributed build would have hit this exact same failure on another machine; with the provider built directly into libcrypto, there is no module file that ever needed embedding)."
