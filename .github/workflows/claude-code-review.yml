name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One review per PR at a time: a newer push cancels the review still running for the
# previous head, so back-to-back pushes do not post duplicate reviews (same pattern as
# tier1.yml).
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Drafts are reviewed once they are marked ready (ready_for_review above). Fork PRs are
    # skipped: their runs get neither the OAuth secret nor an OIDC token, so the action could
    # only fail.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read-only on purpose: the action posts with the Claude GitHub App token it gets through
    # OIDC (id-token: write), not with GITHUB_TOKEN.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      # Third-party actions are pinned to commit SHAs, not mutable tags, per project policy
      # (see tier1.yml). Version in the trailing comment for humans.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
