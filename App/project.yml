name: Macdows

# Optional, untracked local overlay (gitignored). Maintainers with a real signing
# identity put it there and export MACDOWS_SIGN_LOCAL=true before running
# `xcodegen generate` (a disabled include is never read, so contributors need neither
# the file nor the variable — they get the ad-hoc default; see settings.base).
include:
  - path: project-local.yml
    enable: ${MACDOWS_SIGN_LOCAL}

# W4b: MacdowsCore.WindowGeometry is the only coordinate-conversion utility the Swift
# rendering layer (App/RemoteWindowRendering) is allowed to use (per the W4b task spec) --
# resolved as a local SwiftPM package rather than compiled-in sources (unlike CRDPQueue,
# which CRBridge's own comment explains is deliberately linked as raw C sources into an
# ObjC++ static lib) because MacdowsCore is pure Swift with no C-ABI-linkage constraint
# forcing that split.
packages:
  MacdowsCore:
    path: ../Packages/MacdowsCore

options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_VERSION: "6.0"
    # Manual, not Automatic: Automatic signing needs Xcode's account manager to
    # fetch/create a provisioning profile, which isn't available to a headless
    # `xcodebuild` CLI invocation. A local-run macOS app with no restricted
    # entitlements doesn't need a profile — and with no CODE_SIGN_IDENTITY set here,
    # macOS's build-setting default is ad-hoc ("-"), which builds and runs everywhere
    # with no certificate at all. Maintainers who want a stable signing identity
    # (macOS TCC permission grants are keyed to it) supply CODE_SIGN_IDENTITY and
    # DEVELOPMENT_TEAM via the untracked `project-local.yml` overlay — see the
    # include at the top of this file. (The identity must NOT be set here: the main
    # spec always overrides included specs, so a value here would defeat the overlay.)
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Macdows:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    # A single sources: list — a second `sources:` key later in this target would
    # silently replace this one under YAML mapping semantics, not merge with it, which
    # is exactly the bug that produced "no sources are being compiled" on the first
    # attempt (the dylib copyFiles entries clobbered the actual Swift source path).
    sources:
      - path: Macdows
        excludes:
          - Info.plist
      # W4b: shared with the window-smoke tool target (see that target's own sources: —
      # direct source-file sharing, per the task spec's own suggested option, rather than
      # a separate framework target, since neither consumer needs anything the other
      # doesn't and a third Swift module boundary here would buy nothing).
      - path: RemoteWindowRendering
      # Copy Files -> Frameworks: embed the three FreeRDP dylibs the CRBridge target
      # links against. install_name on these is already @rpath (verified against the lab
      # build), so LD_RUNPATH_SEARCH_PATHS = @executable_path/../Frameworks below is
      # sufficient — no install_name_tool rewriting needed (adr/0006 §2).
      #
      # Each entry references only the SONAME symlink (`libfoo.3.dylib`), not the
      # fully-versioned real file (`libfoo.3.30.0.dylib`): that symlink's name is the
      # exact `@rpath/...` load command baked into every dependent, and it's a *single*
      # hop to the real file, which Xcode's Copy Files phase (builtin-copy
      # -resolve-src-symlinks) fully dereferences into real bytes at the symlink's own
      # name — verified empirically. This also means project.yml never needs to change
      # on a FreeRDP patch-version bump (3.30.0 -> 3.30.1 etc.), only on a SONAME bump.
      # `optional: true` lets `xcodegen generate` succeed even before FreeRDP has ever
      # been built (see Scripts/bootstrap.sh, which now runs the FreeRDP build then
      # `xcodegen generate` in sequence so a clean checkout only needs one command).
      - path: ../.build/freerdp/current/prefix/lib/libfreerdp3.3.dylib
        optional: true
        buildPhase:
          copyFiles:
            destination: frameworks
            codeSignOnCopy: true
      - path: ../.build/freerdp/current/prefix/lib/libfreerdp-client3.3.dylib
        optional: true
        buildPhase:
          copyFiles:
            destination: frameworks
            codeSignOnCopy: true
      - path: ../.build/freerdp/current/prefix/lib/libwinpr3.3.dylib
        optional: true
        buildPhase:
          copyFiles:
            destination: frameworks
            codeSignOnCopy: true
      # W8: the three FFmpeg dylibs libfreerdp3 links for H264/AVC decode (adr/0007).
      # Same SONAME-symlink rule as the FreeRDP entries above — `libavcodec.63.dylib` is
      # the literal `@rpath/...` load command baked into libfreerdp3, and it is one hop to
      # the real `libavcodec.63.1.101.dylib`, which Xcode's Copy Files phase dereferences
      # into real bytes under the symlink's own name. So these need editing on an FFmpeg
      # *major* (SONAME) bump only, not on 9.0.1 -> 9.0.2.
      #
      # All three are mandatory, not a menu: libavcodec carries its own LC_LOAD_DYLIB on
      # libswresample (FreeRDP itself calls no swr_* symbol), so shipping two of the three
      # produces an app that fails to load. Scripts/gen-notices.sh asserts all three are
      # present rather than trusting this list.
      #
      # Embedding rather than static-linking is also the LGPL-2.1 §6 obligation, not just a
      # packaging preference — see LGPL_RELINK.md, which tells users how to swap exactly
      # these three files for their own build.
      - path: ../.build/deps/ffmpeg-prefix/lib/libavcodec.63.dylib
        optional: true
        buildPhase:
          copyFiles:
            destination: frameworks
            codeSignOnCopy: true
      - path: ../.build/deps/ffmpeg-prefix/lib/libavutil.61.dylib
        optional: true
        buildPhase:
          copyFiles:
            destination: frameworks
            codeSignOnCopy: true
      - path: ../.build/deps/ffmpeg-prefix/lib/libswresample.7.dylib
        optional: true
        buildPhase:
          copyFiles:
            destination: frameworks
            codeSignOnCopy: true
      # W8 compliance last mile: the licence obligations have to travel with the *artifact*,
      # not just with this repository. Someone who receives only Macdows.app must still get
      # the notices, the verbatim licence texts, and — because FFmpeg is LGPL-2.1 and
      # dynamically redistributed — the §6 procedure for replacing it with their own build.
      # Without these, a shipped bundle is out of compliance no matter how correct the
      # linking is.
      #
      # `type: folder` (a folder reference, not a group): Xcode copies the directory
      # wholesale, so new licence files added to ThirdParty/licenses/ ship automatically and
      # land at Contents/Resources/licenses/. Scripts/gen-notices.sh independently asserts
      # each expected file is present AND byte-identical to the tracked copy, so a silently
      # broken copy phase fails the release gate rather than shipping.
      - path: ../THIRD_PARTY_NOTICES.md
        buildPhase:
          copyFiles:
            destination: resources
      - path: ../LGPL_RELINK.md
        buildPhase:
          copyFiles:
            destination: resources
      - path: ../ThirdParty/licenses
        type: folder
        buildPhase:
          copyFiles:
            destination: resources
    settings:
      base:
        PRODUCT_NAME: Macdows
        PRODUCT_BUNDLE_IDENTIFIER: dev.haru.macdows.dev
        # A hand-authored file, referenced directly rather than through XcodeGen's
        # `info:` key — that key *generates* (overwrites) a plist at the given path
        # rather than using an existing one as-is.
        INFOPLIST_FILE: Macdows/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Macdows/Macdows-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/CRBridge
          - $(SRCROOT)/../.build/freerdp/current/prefix/include/freerdp3
          - $(SRCROOT)/../.build/freerdp/current/prefix/include/winpr3
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/../.build/freerdp/current/prefix/lib
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
        OTHER_LDFLAGS:
          - -lfreerdp3
          - -lfreerdp-client3
          - -lwinpr3
          # CRBridge is an ObjC++ static lib (CRSession.mm) with C++ exception-unwinding
          # scaffolding in it (__cxa_begin_catch/__gxx_personality_v0/std::terminate) even
          # though CRSession.mm itself never throws -- ARC's own exception-safety cleanup
          # paths emit this. Swift's own link driver doesn't pull in libc++ automatically
          # the way clang++ does for a plain C++/ObjC++ executable target (confirmed:
          # Tools/bridge-smoke, a "tool" product type linked via clang++, never needed
          # this explicitly) -- only a Swift *app* target that depends on a C++-containing
          # static lib does.
          - -lc++
          # W4b: CRSession.o (via CRSurfaceSlots.o) references IOSurfaceCreate/Lock/Unlock/
          # GetBaseAddress/GetBytesPerRow -- undefined-symbol link errors otherwise, even
          # though this app target's own Swift code doesn't call IOSurface directly yet
          # (RemoteWindowRegistry does, once wired in).
          - -framework
          - IOSurface
      configs:
        Release:
          # Keep com.apple.security.get-task-allow out of the distributable build.
          # Xcode's CODE_SIGN_INJECT_BASE_ENTITLEMENTS defaults to YES and injects that
          # entitlement whenever it considers the signing to be development-style — which
          # includes the ad-hoc identity this project uses by default, so it was landing on
          # *Release* builds too, not just Debug (verified: the only entitlement on a Release
          # Macdows.app was get-task-allow). It permits any local process to attach a
          # debugger and read/write the app's memory, i.e. to lift live RDP credentials and
          # session keys straight out of a running Macdows, and Apple's notary service
          # rejects it outright.
          #
          # Scoped to Release so Debug keeps the injected entitlements and stays debuggable.
          # Scripts/sign-and-verify.sh independently fails the release gate if a
          # non-Debug bundle still carries it, so this setting is the fix and that check is
          # the proof — neither is trusted on its own.
          #
          # NOTE: this must live under `settings.configs`, not a target-level `configs:`
          # key. The latter is silently ignored by XcodeGen for targets (verified with
          # `xcodebuild -showBuildSettings`) — see the CRBridge target's own configs block,
          # which does not take effect today.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    # Build FreeRDP (and its OpenSSL dependency) before compiling/linking. Both scripts
    # are idempotent — this is a fast no-op once .build/freerdp/current is populated for
    # the current submodule SHA + patch queue + flags, so re-running it on every build
    # (basedOnDependencyAnalysis: false) is cheap and keeps `xcodebuild build` alone
    # sufficient to produce a working app from a clean checkout.
    prebuildScripts:
      - name: "Build vendored FreeRDP"
        script: |
          set -euo pipefail
          "$SRCROOT/../Scripts/build-openssl.sh"
          "$SRCROOT/../Scripts/build-ffmpeg.sh"
          "$SRCROOT/../Scripts/build-freerdp.sh"
        basedOnDependencyAnalysis: false
    dependencies:
      - target: CRBridge
      - package: MacdowsCore
        product: MacdowsCore

  CRBridge:
    type: library.static
    platform: macOS
    deploymentTarget: "14.0"
    # CRDPQueue's C sources are compiled directly into this target rather than linked as
    # a separate SwiftPM product -- Packages/MacdowsCore/Package.swift's own comment on
    # the CRDPQueue target says as much ("meant to be linked directly into the ObjC++
    # CRBridge target"). This keeps the Xcode build graph self-contained (no SwiftPM
    # build invoked from within an xcodebuild target) and is exactly what W3 designed
    # CRDPQueue's C11-only, zero-FreeRDP/AppKit-dependency shape for.
    sources:
      - path: CRBridge
      - path: ../Packages/MacdowsCore/Sources/CRDPQueue
    settings:
      base:
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../.build/freerdp/current/prefix/include/freerdp3
          - $(SRCROOT)/../.build/freerdp/current/prefix/include/winpr3
          - $(SRCROOT)/../Packages/MacdowsCore/Sources/CRDPQueue/include
          # CRSession.mm's OpenSSL legacy-provider startup self-check (adr/0005-adjacent
          # W4a follow-up) calls OSSL_PROVIDER_available/OSSL_PROVIDER_load directly,
          # which needs OpenSSL's own headers -- FreeRDP's installed headers don't
          # re-export them.
          - $(SRCROOT)/../.build/deps/prefix/include
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_ENABLE_OBJC_ARC: YES
        OTHER_CFLAGS:
          - $(inherited)
          # Keep the building machine's absolute paths out of the shipped binary.
          # CRSession.mm's NSAssert expands __FILE__, which clang bakes in as the compiler's
          # full source path — so a Release build of the app carried
          # "/Users/<name>/.../App/CRBridge/CRSession.mm" as a string constant in
          # Contents/MacOS/Macdows. Same defect class as the OpenSSL --openssldir and
          # FreeRDP CMAKE_INSTALL_PREFIX leaks that Scripts/build-openssl.sh and
          # Scripts/build-freerdp.sh already work around with placeholder prefixes.
          #
          # Found during W8 only because the guard that is supposed to catch it
          # (Scripts/gen-notices.sh's $HOME check) was itself silently broken by a
          # pipefail/SIGPIPE interaction and never fired; it does now, and this is what it
          # caught first. Debug builds hid it for a second reason: Xcode puts CRSession.o
          # into Contents/MacOS/Macdows.debug.dylib there, which the scan does not cover.
          #
          # -fmacro-prefix-map, deliberately NOT -ffile-prefix-map/-fdebug-prefix-map:
          # it rewrites __FILE__ only and leaves DWARF paths alone, so debugging and dSYM
          # symbolication are completely unaffected. Result: "App/CRBridge/CRSession.mm".
          #
          # The mapped-from value must be a *literal textual* prefix of the path clang is
          # invoked with — clang does a plain string-prefix replacement, it does not
          # normalise. `$(SRCROOT)/../=` looks equivalent but expands to ".../App/../",
          # which never appears in the compiler's ".../App/CRBridge/CRSession.mm" argument,
          # so it silently matched nothing (confirmed: the leak survived it). `$(SRCROOT)/`
          # is a real prefix, hence this form.
          - -fmacro-prefix-map=$(SRCROOT)/=App/
          # Second entry for the other source tree this target compiles: CRDPQueue's C
          # sources live at $(SRCROOT)/../Packages/..., which the map above cannot reach
          # (it only covers paths under App/). `$(SRCROOT:dir)` is Xcode's own
          # parent-directory operator and expands to the *normalised* repo root with a
          # trailing slash, which is a literal prefix of those paths — unlike
          # "$(SRCROOT)/../", which is not. Result: "Packages/MacdowsCore/...".
          - -fmacro-prefix-map=$(SRCROOT:dir)=
    configs:
      Debug:
        # W4a review H3 intended crb_verify_certificate_ex's insecure "accept
        # unconditionally, this session only" behavior to be Debug-only, gated on this
        # macro. KNOWN-INEFFECTIVE (W8 round finding): XcodeGen silently ignores a
        # target-level `configs:` key, so this macro has NEVER been defined in any
        # configuration (verified: `xcodebuild -target CRBridge -configuration Debug
        # -showBuildSettings` shows only DEBUG=1, and the generated pbxproj contains no
        # CRB_ALLOW_INSECURE_CERT). Actual behavior today: EVERY configuration, Debug
        # included, rejects every certificate -- the W4a Debug escape hatch has never
        # existed. Fail-safe, so deliberately left unfixed: the working fix (moving this
        # under `settings.configs` like the Macdows target's Release entry) would enable
        # insecure certificate acceptance in Debug builds, a security-relevant change in
        # W4a's area that needs an explicit owner decision weighing the dev-loop cost of
        # having no escape hatch. Never define this for a Release/distributed build.
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) CRB_ALLOW_INSECURE_CERT=1"
    prebuildScripts:
      - name: "Build vendored FreeRDP"
        script: |
          set -euo pipefail
          "$SRCROOT/../Scripts/build-openssl.sh"
          "$SRCROOT/../Scripts/build-ffmpeg.sh"
          "$SRCROOT/../Scripts/build-freerdp.sh"
        basedOnDependencyAnalysis: false

  bridge-smoke:
    # W4a CLI verification harness (Tools/bridge-smoke) -- an Xcode "tool" target sharing
    # CRBridge's exact build settings/dependency graph rather than a standalone CMake
    # build, so it never drifts from what the real App target links against. Instantiates
    # CRSession directly, connects to a real host (credentials from
    # ~/.config/macdows/host.env, read by main.mm itself -- never by library code),
    # drains and prints every control-lane event, then runs the full shutdown protocol.
    # `.app`'s own TCC identity gates local-network access behind a first-run prompt a
    # headless CI/CLI context can't answer -- this tool, launched from an already-trusted
    # Terminal.app, is Phase 1's actual real-host verification vehicle; the app target
    # itself gets real-host verification later once its own TCC prompt has been granted
    # interactively.
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ../Tools/bridge-smoke
    settings:
      base:
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/CRBridge
          - $(SRCROOT)/../.build/freerdp/current/prefix/include/freerdp3
          - $(SRCROOT)/../.build/freerdp/current/prefix/include/winpr3
        CLANG_ENABLE_OBJC_ARC: YES
        # This tool links the vendored FreeRDP dylibs directly at their build location
        # (no Copy-Files-and-resign step the way the App target has) -- their original
        # signature's Team ID doesn't match this target's, and Hardened Runtime's library
        # validation rejects that mismatch at load time (confirmed empirically: dyld
        # refused with "different Team IDs" until this was turned off). bridge-smoke is a
        # dev/test harness, never a distributed artifact, so relaxing this here (and only
        # here) is the minimal-blast-radius fix -- it does not affect the App target's own
        # (still Hardened-Runtime, still team-matched via resigned copies) build.
        ENABLE_HARDENED_RUNTIME: NO
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/../.build/freerdp/current/prefix/lib
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../.build/freerdp/current/prefix/lib
        OTHER_LDFLAGS:
          - -lfreerdp3
          - -lfreerdp-client3
          - -lwinpr3
          # W4b: same reason as the App target's identical addition -- CRSession.o/
          # CRSurfaceSlots.o (pulled in via the CRBridge dependency) reference IOSurface
          # symbols regardless of whether bridge-smoke's own main.mm calls into them.
          - -framework
          - IOSurface
    dependencies:
      - target: CRBridge

  window-smoke:
    # W4b's real-host pixel-path verification harness (Tools/window-smoke) -- unlike
    # bridge-smoke (headless), this drives a real NSApplication so RemoteWindowRegistry/
    # RemoteWindow (App/RemoteWindowRendering, shared with the Macdows app target via
    # direct source-file sharing rather than a separate framework target) actually create
    # and composite on-screen NSWindows. Same Terminal.app-relay real-network-access
    # approach as bridge-smoke; see that target's own comment for why.
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ../Tools/window-smoke
      - path: RemoteWindowRendering
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Macdows/Macdows-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/CRBridge
          - $(SRCROOT)/../.build/freerdp/current/prefix/include/freerdp3
          - $(SRCROOT)/../.build/freerdp/current/prefix/include/winpr3
        # Same Team-ID-mismatch issue bridge-smoke's own comment documents (the vendored
        # FreeRDP dylibs are linked directly at their build location, not through a
        # Copy-Files-and-resign step) -- a dev/test harness, never a distributed artifact.
        ENABLE_HARDENED_RUNTIME: NO
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/../.build/freerdp/current/prefix/lib
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../.build/freerdp/current/prefix/lib
        OTHER_LDFLAGS:
          - -lfreerdp3
          - -lfreerdp-client3
          - -lwinpr3
          # Same reason as bridge-smoke's/the App target's identical addition -- CRSession.o/
          # CRSurfaceSlots.o (pulled in via the CRBridge dependency) reference IOSurface
          # symbols regardless of what this target's own Swift sources autolink for.
          - -framework
          - IOSurface
          # Same reason as the App target's identical addition: this is a Swift-linked
          # target (main.swift), not an ObjC++/clang++-linked one like bridge-smoke, so
          # Swift's link driver doesn't automatically pull in libc++ for CRBridge's C++
          # exception-unwinding scaffolding (CRSession.mm/CRSurfaceSlots.mm).
          - -lc++
    dependencies:
      - target: CRBridge
      - package: MacdowsCore
        product: MacdowsCore

# W4c review H2: explicit, so `xcodegen generate` always deterministically (re)produces
# exactly these four schemes on any machine/checkout, rather than relying on XcodeGen's
# implicit per-target scheme auto-generation. That implicit behavior turned out to be the
# root cause behind a real build-flakiness episode this round: building this project's own
# raw SwiftPM-package scheme directly (e.g. `-scheme MacdowsCore`, which XcodeGen doesn't
# own at all -- it belongs to the *embedded* package project Xcode creates when resolving
# `packages:` above, a logically separate project with its own build-output identity) does
# NOT reliably populate what a `SYMROOT`-redirected build of one of *this* project's own
# targets expects to find, causing "Unable to resolve module dependency: MacdowsCore"
# under a from-scratch SYMROOT. Building exclusively through one of these four schemes --
# never a bare package scheme -- goes through this project's own coherent package-
# resolution + build graph instead and is the only supported entry point going forward
# (`Scripts/run-window-smoke.command` already only ever invokes `-scheme window-smoke`,
# never a package scheme, so it needed no content change once this list made that scheme
# reproducible rather than implicit).
#
# `.xcodeproj` itself stays gitignored (generated output, not source); this list is what
# makes its *schemes* reproducible from source (project.yml, which IS tracked) without
# needing a shared, committed `.xcodeproj`.
schemes:
  Macdows:
    build:
      targets:
        Macdows: all
  CRBridge:
    build:
      targets:
        CRBridge: all
  bridge-smoke:
    build:
      targets:
        bridge-smoke: all
  window-smoke:
    build:
      targets:
        window-smoke: all
